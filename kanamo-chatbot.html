<!doctype html>
<html lang="ja" data-theme="light"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanamo ネイル案内チャット</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
  /* ---- Nail Salon Kanamo 公式サイトのトークンを継承 ---- */
  :root {
    --paper: #ffffff;
    --white: #ffffff;
    --ink: #333333;
    --muted: #666666;
    --line: #d8d8d8;
    --rose: #505050;
    --rose-light: #eeeeee;
    --rose-ink: #ffffff;
    --shadow: 0 24px 60px rgba(51, 51, 51, .16);
    --serif: "Yu Mincho", "Hiragino Mincho ProN", "Shippori Mincho", serif;
    --english: Georgia, "Times New Roman", "Yu Mincho", serif;
    --fs: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1f1a1a; --white: #2a2424; --ink: #efe7e3; --muted: #b3a5a1;
      --line: #4a3f3f; --rose: #c99ca1; --rose-light: #3b2f31; --rose-ink: #1f1a1a;
      --shadow: 0 24px 60px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1f1a1a; --white: #2a2424; --ink: #efe7e3; --muted: #b3a5a1;
    --line: #4a3f3f; --rose: #c99ca1; --rose-light: #3b2f31; --rose-ink: #1f1a1a;
    --shadow: 0 24px 60px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--serif); font-size: var(--fs); line-height: 1.9; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 1px solid var(--rose); outline-offset: 3px; }

  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--english); font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--rose);
  }
  .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--rose); flex: none; }

  /* ---------- 背景（サイトの代わりの説明ページ） ---------- */
  .backdrop { max-width: 720px; margin: 0 auto; padding: 56px 24px 220px; }
  .backdrop h1 {
    font-family: var(--serif); font-weight: 500; font-size: 28px; letter-spacing: .08em;
    line-height: 1.5; margin: 14px 0 16px; text-wrap: balance;
  }
  .backdrop h1 em { font-style: normal; color: var(--rose); }
  .backdrop p { color: var(--muted); font-size: 14px; max-width: 36em; margin: 0 0 8px; letter-spacing: .04em; }
  .backdrop .note {
    margin-top: 32px; padding: 18px 20px; border: .8px solid var(--line); background: var(--white);
    font-size: 13px; letter-spacing: .03em; color: var(--muted);
  }
  .backdrop .note b { color: var(--rose); font-weight: 600; }
  .backdrop code { font-family: var(--english); font-size: 13px; color: var(--ink); }

  /* ---------- 斜線アイコン（サイトのボタンと同じ） ---------- */
  .diag { width: 14px; height: 14px; flex: none; }

  /* ---------- 起動ボタン ---------- */
  .kb-launcher {
    position: fixed; right: 20px; bottom: 20px; z-index: 50;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 0 22px; height: 52px; border: 0;
    background: var(--rose); color: var(--rose-ink);
    font-family: var(--serif); font-size: 14px; letter-spacing: .18em;
    box-shadow: var(--shadow); cursor: pointer;
  }
  .kb-launcher[hidden] { display: none; }

  /* ---------- パネル ---------- */
  .kb-panel {
    position: fixed; right: 20px; bottom: 20px; z-index: 60;
    width: min(420px, calc(100vw - 40px)); height: min(720px, calc(100vh - 40px));
    display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    border: .8px solid var(--line); box-shadow: var(--shadow); overflow: hidden;
  }
  .kb-panel[hidden] { display: none; }
  @media (max-width: 560px) {
    .kb-panel { right: 0; bottom: 0; width: 100vw; height: 100dvh; border: 0; }
  }

  .kb-head {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 16px 14px 20px; border-bottom: .8px solid var(--line); background: var(--white);
  }
  .kb-title { flex: 1; min-width: 0; }
  .kb-title .name { font-family: var(--english); font-size: 22px; line-height: 1.1; letter-spacing: .02em; }
  .kb-title .name i { font-style: normal; color: var(--rose); }
  .kb-title .sub { font-family: var(--english); font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .kb-tools { display: flex; gap: 8px; }
  .kb-tools button {
    height: 34px; padding: 0 12px; border: .8px solid var(--line); background: transparent;
    font-family: var(--serif); font-size: 12px; letter-spacing: .1em; cursor: pointer;
  }
  .kb-tools button[aria-pressed="true"] { border-color: var(--rose); color: var(--rose); }
  .kb-tools .x { width: 34px; padding: 0; font-family: var(--english); font-size: 16px; }

  .kb-log {
    flex: 1; overflow-y: auto; padding: 20px 18px 14px;
    display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) { .kb-log { scroll-behavior: auto; } }

  .msg { display: flex; gap: 12px; }
  .msg .who {
    width: 30px; height: 30px; flex: none; margin-top: 4px;
    border: .8px solid var(--line); background: var(--white); color: var(--rose);
    display: grid; place-items: center; font-family: var(--english); font-style: italic; font-size: 15px;
  }
  .msg .bubble {
    padding: 14px 18px; max-width: calc(100% - 42px);
    background: var(--white); border: .8px solid var(--line);
    letter-spacing: .03em; line-height: 1.85;
  }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--rose); color: var(--rose-ink); border-color: var(--rose); letter-spacing: .06em; }
  .bubble p { margin: 0; }
  .bubble p + p { margin-top: 10px; }
  .bubble strong { font-weight: 600; color: var(--rose); }
  .msg.user .bubble strong { color: inherit; }
  .bubble ul { margin: 8px 0 0; padding: 0; list-style: none; }
  .bubble li { position: relative; padding-left: 18px; }
  .bubble li::before { content: ""; position: absolute; left: 0; top: .95em; width: 10px; height: 1px; background: var(--rose); }
  .bubble li + li { margin-top: 6px; }

  .price-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .price-table th, .price-table td { padding: 10px 2px; border-bottom: .8px solid var(--line); vertical-align: top; text-align: left; font-weight: 400; }
  .price-table th { font-size: .95em; letter-spacing: .03em; }
  .price-table td.price { text-align: right; white-space: nowrap; font-family: var(--english); font-size: 1.15em; font-variant-numeric: tabular-nums; color: var(--ink); }
  .price-table tr:last-child th, .price-table tr:last-child td { border-bottom: 0; }
  .price-table small { display: block; color: var(--muted); font-size: .82em; letter-spacing: .02em; line-height: 1.6; margin-top: 2px; }

  /* ---------- 選択肢 ---------- */
  .choices { display: flex; flex-direction: column; gap: 8px; padding-left: 42px; }
  .choices .eyebrow { margin: 4px 0 4px 2px; }
  .choice {
    display: flex; align-items: center; gap: 14px; width: 100%;
    min-height: 56px; padding: 12px 16px 12px 18px; text-align: left;
    border: .8px solid var(--line); background: var(--white); color: var(--ink);
    font-family: var(--serif); font-size: 16px; font-weight: 500; letter-spacing: .06em; line-height: 1.45;
    cursor: pointer; text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  .choice .idx { font-family: var(--english); font-style: italic; font-size: 13px; color: var(--rose); width: 22px; flex: none; letter-spacing: 0; }
  .choice .tx { flex: 1; }
  .choice .diag { color: var(--rose); }
  .choice:hover { border-color: var(--rose); }
  .choice.cta { background: var(--rose); color: var(--rose-ink); border-color: var(--rose); }
  .choice.cta .diag { color: var(--rose-ink); }
  .choice.cta:hover { filter: brightness(1.06); }
  .choice.quiet { background: transparent; border-color: transparent; min-height: 44px; color: var(--muted); font-size: 14px; letter-spacing: .1em; padding-left: 4px; }
  .choice.quiet .diag { color: var(--muted); }
  .choice.quiet:hover { color: var(--rose); border-color: transparent; }
  .choices.done .choice { opacity: .4; pointer-events: none; }
  .choices.done .choice.picked { opacity: 1; border-color: var(--rose); background: var(--rose-light); color: var(--ink); }
  .choices.done .eyebrow { opacity: .5; }

  .typing { display: inline-flex; gap: 6px; padding: 8px 2px; }
  .typing i { width: 5px; height: 5px; background: var(--rose); opacity: .4; animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }

  /* ---------- 下部バー ---------- */
  .kb-bar {
    display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 8px;
    padding: 12px 14px 14px; border-top: .8px solid var(--line); background: var(--white);
  }
  .kb-bar button, .kb-bar a {
    height: 48px; border: .8px solid var(--line); background: transparent; color: var(--ink);
    font-family: var(--serif); font-size: 13px; letter-spacing: .14em;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; text-decoration: none;
  }
  .kb-bar button:hover:not(:disabled), .kb-bar a:hover { border-color: var(--rose); }
  .kb-bar button:disabled { opacity: .35; cursor: default; }
  .kb-bar .arr { font-family: var(--english); font-size: 15px; }
  .kb-bar a.primary { background: var(--rose); color: var(--rose-ink); border-color: var(--rose); }

  /* ---------- 入力欄 ---------- */
  .kb-ask { border-top: .8px solid var(--line); background: var(--white); padding: 10px 14px 0; }
  .kb-sug { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .kb-sug:empty { display: none; }
  .kb-sug .eyebrow { width: 100%; margin: 2px 0 2px; }
  .kb-sug button {
    border: .8px solid var(--line); background: var(--paper); color: var(--ink);
    font-family: var(--serif); font-size: 13px; letter-spacing: .04em; padding: 7px 12px; cursor: pointer;
  }
  .kb-sug button:hover { border-color: var(--rose); color: var(--rose); }
  .kb-form { display: flex; gap: 8px; }
  .kb-form input {
    flex: 1; min-width: 0; height: 48px; padding: 0 14px;
    border: .8px solid var(--line); background: var(--paper); color: var(--ink);
    font-family: var(--serif); font-size: 16px; letter-spacing: .04em;
  }
  .kb-form input::placeholder { color: var(--muted); opacity: .8; }
  .kb-form input { text-overflow: ellipsis; }
  .kb-form input:focus { outline: none; border-color: var(--rose); }
  .kb-form button {
    height: 48px; padding: 0 14px; flex: none; border: .8px solid var(--rose); background: transparent; color: var(--rose);
    font-family: var(--serif); font-size: 13px; letter-spacing: .14em; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .kb-form button:hover { background: var(--rose); color: var(--rose-ink); }
  .kb-bar { border-top: 0; padding-top: 10px; }
  .kb-panel[data-size="large"] .kb-form input { font-size: 18px; }

  .kb-panel[data-size="large"] { --fs: 18px; }
  .kb-panel[data-size="large"] .choice { font-size: 18px; min-height: 62px; }
  .kb-panel[data-size="large"] .kb-bar button, .kb-panel[data-size="large"] .kb-bar a { font-size: 15px; }
/* Match the homepage gold-outline action buttons. */
.kb-launcher,.choice.cta,.kb-bar a.primary,.kb-form button:hover{background:transparent;color:#453f3a;border:1px solid #b39a65}
.choice.cta .diag{color:inherit}
.kb-launcher:hover,.choice.cta:hover,.kb-bar a.primary:hover{background:rgba(179,154,101,.08);border-color:#b39a65;filter:none}

/* Soft portrait background behind the conversation. */
.kb-panel{background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url('assets/chat-background-portrait.webp') center/cover no-repeat}
</style>

  let history = [];      // ノードID または 動的ノードオブジェクト
  let busy = false;

  let savedAnchor = null;
  let savedAnchorOffset = 0;

  // ---- 入力の正規化（全角→半角、小文字、カタカナ→ひらがな、空白除去） ----
  const kata2hira = (t) => t.replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const norm = (t) => kata2hira(String(t).normalize("NFKC").toLowerCase()).replace(/[\s、。・！？!?「」()（）]/g, "");

  // ---- 意図判定：一致したキーの文字数合計をスコアにする ----
  function matchIntents(text, context = null) {
    const t = norm(text);
    if (!t) return [];
    let hits = INTENTS.map((it) => {
      let score = 0;
      it.keys.forEach((k) => { const nk = norm(k); if (nk && t.includes(nk)) score += nk.length; });
      return { it, score };
    }).filter((r) => r.score > 0).sort((a, b) => b.score - a.score);
    const select = to => [{it: INTENTS.find(it => it.to === to), score: 1000}];
    const explicitKanamo = /かなも|kanamo/.test(t);
    if (explicitKanamo) hits = hits.filter(h => !["friends","lian","lala","sapadecopo","salon_scope"].includes(h.it.to));
    const named = [
      [/りあん|lian|くぬぎ山|くぬぎやま/, "lian"],
      [/ららねいる|lalanails|五香|ごこう/, "lala"],
    ].filter(([pattern]) => pattern.test(t));
    // 他店名があっても詳細回答は作らず、店舗紹介だけに案内する。
    if (!explicitKanamo && named.length) return select(named.length > 1 ? "friends" : named[0][1]);
    if (!explicitKanamo && /仲間のさろん|他のさろん|元すたっふのお店|さぱでこぽの仲間|系列店|姉妹店/.test(t)) return select("friends");
    if (!explicitKanamo && /さぱでこ|sapadecopo/.test(t)) return select("sapadecopo");
    if (/すくりーんしょっと|すくしょ|保存したい|保存方法|気に入ったでざいんを伝えたい|番号を覚え|でざいん番号/.test(t)) return select("design_save");
    if (/柄が見つからない|でざいんが見つからない|この画像と同じ|この写真と同じ/.test(t)) return select("design_missing");
    if (/色違い|ぴんくにできる|ぴんくにしたい/.test(t)) return select("faq_color");
    if (/写真はどこ|画像を見たい|画像が見たい|でざいん写真/.test(t)) return select("design_search");
    const design = hits.find(h => h.it.to === "design_search");
    // 店舗紹介直後の曖昧な用件だけ確認。デザイン語はカナモを案内する。
    if (!explicitKanamo && !design && ["friends","lian","lala","sapadecopo","salon_scope"].includes(context)
        && /料金|いくら|値段|予約|営業時間|あくせす|場所|住所/.test(t)) return select("salon_scope");
    if (/^(かなもの|kanamoの)?予約(したい|は)?$/.test(t)) return select("reserve_how");

    if (!design) return hits;
    // デザイン語が含まれても、具体的な用件・症状・既存メニューを優先する。
    const routes = [
      ["cancel", /きゃんせる|取り消し|日程|延期|りすけ/],
      ["menu_change", /めにゅー変更|めにゅーを変更|こーす変更|こーすを変更/],
      ["green", /ぐりーんねいる|かび|感染|爪.*緑|緑.*(変色|心配)/],
      ["faq_lift", /取れ|とれ|剥が|はが|浮い|欠け/],
      ["faq_length", /亀裂|ひび|割れ|折れ|補修|補強|長さ出し|長さだし/],
      ["warranty_detail", /保証|保障|お直し|直して/],
      ["bring", /持ち込|持込|おーだー|いんすたで見た/],
      ["faq_color", /色変更|色替え|色変え|色を変え|色を替え|からー変更|配置/],
      ["menu", /料金|値段|価格|いくら|金額/],
      ["reserve_how", /予約/],
    ];
    for (const [to, pattern] of routes) {
      if (pattern.test(t)) {
        const hit = hits.find(h => h.it.to === to);
        const it = hit?.it || INTENTS.find(it => it.to === to);
        if (it) return [{ it, score: 1000 }];
      }
    }
    // 単独メニュー名は既存の料金案内を維持（例：ラメグラデ、フットマグネット）。
    if (/わんからー|ふれんち|ぐらで|まぐねっと|ふらっしゅ/.test(t)) {
      const to = /ふっと|足|ぺでぃ/.test(t) ? "foot_menu" : "hand_other";
      const it = INTENTS.find(it => it.to === to);
      return [{ it, score: 1000 }];
    }
    // 色の「緑」を病名、画像を見る質問を持ち込み相談として扱わない。
    return [design];
  }

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const pad = (n) => String(n).padStart(2, "0");

  function scrollBottom() { log.scrollTop = log.scrollHeight; }

  function userBubble(text) {
    const el = document.createElement("div");
    el.className = "msg user";
    el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    log.appendChild(el);
    scrollBottom();
  }

  function botBubble(node) {
    const el = document.createElement("div");
    el.className = "msg bot";
    let html = "";
    (node.text || []).forEach((p) => { html += `<p>${md(p)}</p>`; });
    if (node.list) html += "<ul>" + node.list.map((li) => `<li>${md(li)}</li>`).join("") + "</ul>";
    if (node.table) {
      html += '<table class="price-table">' + node.table.map((r) =>
        `<tr><th>${esc(r.name)}${r.note ? `<small>${esc(r.note)}</small>` : ""}</th><td class="price">${esc(r.price)}</td></tr>`
      ).join("") + "</table>";
    }
    (node.text2 || []).forEach((p) => { html += `<p>${md(p)}</p>`; });
    el.innerHTML = `<div class="who" aria-hidden="true">K</div><div class="bubble">${html}</div>`;
    log.appendChild(el);
    return el;
  }

  function typing() {
    const el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = `<div class="who" aria-hidden="true">K</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;

  function choices(node, nodeId) {
    const wrap = document.createElement("div");
    wrap.className = "choices";
    const items = [];

    (node.links || []).forEach((l) => {
      const a = document.createElement("a");
      a.className = "choice cta";
      a.href = l.url;
      if (!l.url.startsWith("tel:")) { a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = `<span class="tx">${esc(l.label)}</span>${DIAG}`;
      items.push(a);
    });

    const nexts = node.next || [];
    if (nexts.length) {
      const lab = document.createElement("div");
      lab.className = "eyebrow";
      lab.textContent = node.label ? node.label : (node.links ? "つづけて選ぶ" : "次に知りたいこと");
      wrap.appendChild(lab);
    }
    nexts.forEach((n, k) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      b.innerHTML = (node.numbered ? `<span class="idx">${pad(k + 1)}</span>` : "") +
        `<span class="tx">${esc(n.label)}</span>${DIAG}`;
      b.addEventListener("click", () => {
        if (busy) return;
        wrap.classList.add("done");
        b.classList.add("picked");
        go(n.to, n.label);
      });
      items.push(b);
    });

    if (nodeId !== "start" && !node.numbered) {
      const home = document.createElement("button");
      home.type = "button";
      home.className = "choice quiet";
      home.innerHTML = `<span class="tx">最初のメニューに戻る</span>${DIAG}`;
      home.addEventListener("click", () => {
        if (busy) return;
        wrap.classList.add("done");
        home.classList.add("picked");
        go("start", "最初のメニューに戻る", true);
      });
      items.push(home);
    }

    items.forEach((i) => wrap.appendChild(i));
    log.appendChild(wrap);
  }

  function render(nodeId) {
    const node = typeof nodeId === "string" ? KANAMO_DATA[nodeId] : nodeId;
    if (!node) return;
    if (typeof nodeId !== "string") nodeId = node.id || "dynamic";
    busy = true;
    const t = typing();
    setTimeout(() => {
      t.remove();
      const response = botBubble(node);
      choices(node, nodeId);
      // 回答末尾ではなく、最新の回答の先頭から読める位置に合わせる。
      const top = log.scrollTop + response.getBoundingClientRect().top
        - log.getBoundingClientRect().top - parseFloat(getComputedStyle(log).paddingTop);
      log.scrollTo({ top, behavior: "instant" });
      busy = false;
      btnBack.disabled = history.length < 2;
    }, reduceMotion ? 0 : 350);
  }

  function go(nodeId, label, reset) {
    if (label) userBubble(label);
    if (reset) history = [];
    history.push(nodeId);
    render(nodeId);
  }

  // ---- 自由入力への応答 ----
  function answer(text) {
    const hits = matchIntents(text, history[history.length - 1]);
    markAllDone();
    sug.innerHTML = "";
    if (!hits.length) { go("unknown", text); return; }
    const top = hits[0];
    const rivals = hits.filter((h) => h.score === top.score && h.it.to !== top.it.to);
    if (!rivals.length) { go(top.it.to, text); return; }
    // 同点が複数：候補を提示
    const seen = new Set();
    const cands = hits.filter((h) => { if (seen.has(h.it.to)) return false; seen.add(h.it.to); return true; })
      .slice(0, 4).map((h) => ({ label: h.it.q, to: h.it.to }));
    go({ id: "clarify", text: ["こちらのご質問でしょうか？近いものをお選びください。"], next: cands, label: "近い質問" }, text);
  }

  function showSuggestions() {
    const t = input.value.trim();
    sug.innerHTML = "";
    if (!t) return;
    const hits = matchIntents(t, history[history.length - 1]);
    const seen = new Set();
    const list = hits.filter((h) => { if (seen.has(h.it.to)) return false; seen.add(h.it.to); return true; }).slice(0, 4);
    if (!list.length) return;
    const lab = document.createElement("div");
    lab.className = "eyebrow"; lab.textContent = "もしかして";
    sug.appendChild(lab);
    list.forEach((h) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = h.it.q;
      b.addEventListener("click", () => { if (busy) return; input.value = ""; showSuggestions(); markAllDone(); go(h.it.to, h.it.q); });
      sug.appendChild(b);
    });
  }

  input.addEventListener("input", showSuggestions);
  // 日本語入力の変換確定Enterでは送信しない（isComposing / keyCode 229 を除外）
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t || busy) return;
    input.value = "";
    answer(t);
  });

  function markAllDone() {
    log.querySelectorAll(".choices:not(.done)").forEach((c) => c.classList.add("done"));
  }

  btnBack.addEventListener("click", () => {
    if (busy || history.length < 2) return;
    history.pop();
    markAllDone();
    userBubble("ひとつ戻る");
    render(history[history.length - 1]);
  });
  btnHome.addEventListener("click", () => {
    if (busy) return;
    markAllDone();
    go("start", "最初のメニューに戻る", true);
  });
  btnClose.addEventListener("click", () => {
    savedScrollTop = log.scrollTop;
    const edge = log.getBoundingClientRect().top;
    savedAnchor = [...log.children].find(el => el.getBoundingClientRect().bottom > edge);
    savedAnchorOffset = savedAnchor ? savedAnchor.getBoundingClientRect().top - edge : 0;
    panel.hidden = true;
    launcher.hidden = false;
  });
  launcher.addEventListener("click", () => {
    launcher.hidden = true;
    panel.hidden = false;
    // 再表示時の幅の変化でも、読んでいた要素の位置を保持する。
    requestAnimationFrame(() => {
      const top = savedAnchor?.isConnected
        ? log.scrollTop + savedAnchor.getBoundingClientRect().top
          - log.getBoundingClientRect().top - savedAnchorOffset
        : savedScrollTop;
      log.scrollTo({ top, behavior: "instant" });
    });
  });
  btnSize.addEventListener("click", () => {
    const large = panel.dataset.size !== "large";
    panel.dataset.size = large ? "large" : "normal";
    btnSize.setAttribute("aria-pressed", String(large));
    btnSize.textContent = large ? "文字 標準" : "文字 大";
  });

  history = ["start"];
  render("start");
})();
</script>


<script>
document.getElementById("kbClose").addEventListener("click", () => {
  parent.postMessage({type:"kanamo-chat-close"}, location.origin);
});
window.addEventListener("message", (event) => {
  if(event.origin !== location.origin || event.source !== parent) return;
  if(event.data?.type === "kanamo-chat-open") {
    if(document.getElementById("kbPanel").hidden) document.getElementById("kbLauncher").click();
    document.getElementById("kbClose").focus();
  }
});
document.addEventListener("keydown", (event) => {
  if(event.key === "Escape") { event.preventDefault(); document.getElementById("kbClose").click(); }
  if(event.key === "Tab") {
    const panel = document.getElementById("kbPanel");
    if(panel.hidden) return;
    const items = [...panel.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),[tabindex="0"]')].filter(el => el.getClientRects().length);
    const first = items[0], last = items[items.length - 1];
    if(event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if(!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});
parent.postMessage({type:"kanamo-chat-ready"}, location.origin);
</script>
</body></html>
